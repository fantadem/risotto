<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recette Risotto</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <!-- Feuille de style personnalisée -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================== NAVBAR ============================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🍚 Risotto</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#hero">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#ingredients">Ingrédients</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#etapes">Étapes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================== HEADER / HERO ============================== -->
    <header id="hero" class="bg-warning-subtle py-5">
        <div class="container text-center">

            <h1 class="display-3 fw-bold mb-3">Risotto</h1>

            <!-- Emplacement badge Nutri-Score (rempli par js/nutriscore.js) -->
            <div id="nutriscore-recette" class="mb-4"></div>

            <!-- Image de la recette -->
            <img
                src="https://joyfoodsunshine.com/wp-content/uploads/2023/04/easy-risotto-recipe-1.jpg"
                alt="Image d'un risotto"
                class="img-fluid rounded shadow"
                style="max-height: 420px; object-fit: cover; width: 100%;"
            >

        </div>
    </header>

    <!-- ============================== MAIN ============================== -->
    <main class="container my-5">

        <!-- Section Ingrédients -->
        <section id="ingredients" class="mb-5">
            <h2 class="mb-4 border-bottom pb-2">🧅 Ingrédients</h2>
            <ul id="productList" class="list-group list-group-flush">
                <!-- Rempli dynamiquement par js/ingredients.js -->
            </ul>
        </section>

        <hr>

        <!-- Section Étapes -->
        <section id="etapes" class="mt-5">
            <h2 class="mb-4 border-bottom pb-2">👨‍🍳 Étapes</h2>
            <ol id="etapesList" class="list-group list-group-numbered">
                <!-- Rempli dynamiquement par js/etapes.js -->
            </ol>
        </section>

    </main>

    <!-- ============================== FOOTER ============================== -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <p class="mb-1 fw-bold"><small>Chef de projet : Fanta Dembele</small></p>
            <p class="mb-1"><small>Recette de risotto &mdash; Projet équipe IF08</small></p>
            <p class="mb-0"><small><a href="https://www.marmiton.org/recettes/recette_risotto_19539.aspx" class="text-warning">Source : Marmiton</a></small></p>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

    <!-- Scripts du projet (dans cet ordre précis) -->
    <script src="js/ingredients.js"></script>
    <script src="js/nutriscore.js"></script>
    <script src="js/etapes.js"></script>

</body>

</html>
